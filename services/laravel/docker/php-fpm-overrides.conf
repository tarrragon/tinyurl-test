; 覆蓋官方映像檔 php-fpm.d/docker.conf 的預設值。php-fpm.d/ 底下的檔案依檔名順序讀取，
; 這個檔在 Dockerfile 裡複製成 zzz-overrides.conf，排在最後，後讀到的設定覆蓋前面的。

[global]
; docker stop 與 reload 時，最多等進行中的請求這麼久。預設是 0：不等，進行中的請求直接拿到 502。
; 要比最長的正常請求長，也要比平台的停機逾時（docker stop 預設 10 秒）短。
process_control_timeout = 8

[www]
; 官方映像檔在 docker.conf 設 listen = 9000，聽在所有網路介面。
; FastCGI 只給同一個容器裡的 Nginx 用，改成只聽 127.0.0.1，compose 網路上的其他容器連不到。
listen = 127.0.0.1:9000
