# 監控主機上跑的元件：Prometheus 讀各主機的 exporter、Alertmanager 分組與抑制告警、Grafana 畫面板。
# 單機時 .env 的 COMPOSE_FILE 把這個檔與 docker-compose.yml 合成同一個 compose 專案，
# Prometheus 以服務名稱連到同一台上的 exporter；多台主機時這個檔單獨跑在監控主機上，
# 讀哪些主機由 infra/observability/prometheus/targets/ 的清單決定（見 infra/observability/README.md〈多台主機〉）。
# Prometheus、Alertmanager 與 Grafana 只綁 127.0.0.1，不對外開放。

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # 改了讀取設定或規則之後，POST /-/reload 重新載入，不必重啟；targets/ 的清單改了不必重新載入
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./infra/observability/prometheus/targets:/etc/prometheus/targets:ro
      - promdata:/prometheus

  # 告警的分組與抑制；目前沒有通知管道，告警在它的頁面上看
  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      # 只在資料庫第一次建立時用來設定管理者密碼；grafanadata 留著時，之後改這個變數不會改變登入密碼
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  promdata:
  grafanadata:
