# 給 nginx-prometheus-exporter 讀的連線數（stub_status），只聽 8081、只接受 compose 網路內的私有位址，
# compose 沒有把 8081 對外發佈，所以從主機外面打不到
server {
    listen 8081;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }
}
