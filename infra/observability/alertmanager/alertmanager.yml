# Alertmanager：告警的分組與抑制。目前沒有設定通知管道，告警只在 Alertmanager 的頁面上看得到
# （http://127.0.0.1:${ALERTMANAGER_PORT:-9093}）；通知管道見 infra/observability/README.md〈告警〉。
# 改完用 amtool 檢查語法：
#   docker run --rm -v "$PWD/infra/observability/alertmanager:/a" --entrypoint amtool prom/alertmanager:v0.34.1 check-config /a/alertmanager.yml
route:
  receiver: none
  # 依主機分組：同一台主機的同一種告警合成一則，不同主機各自一則
  group_by: [alertname, host]
receivers:
  - name: none

inhibit_rules:
  # 主機飽和時，讀取變慢與各服務變慢是它造成的症狀，不另外通知。
  # 只抑制不通知值班的症狀（warning）；會通知值班的症狀不抑制。
  # equal: [host]：一台主機飽和只壓下同一台主機上的症狀。host 標籤由 prometheus/targets/ 的清單加上，
  # instance 不能代替它（instance 是讀取對象的位址，同一台主機上每個 exporter 都不同）
  - source_matchers: [alertname="HostCpuSaturated"]
    target_matchers: [alertname=~"ScrapeNearTimeout|ProbeSlow|ServiceSlow", severity="warning"]
    equal: [host]
