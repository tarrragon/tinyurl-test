# 告警規則。設計見 infra/observability/README.md〈告警〉：
# 可用性與延遲分開判斷、條件持續一段時間才成立、主機飽和時抑制它造成的症狀（抑制規則在 alertmanager.yml）。
# 改完用 promtool 檢查語法：
#   docker run --rm -v "$PWD/infra/observability/prometheus:/p" --entrypoint promtool prom/prometheus:v3.15.0 check rules /p/rules/alerts.yml
groups:
  - name: availability
    rules:
      # Gatus 的探測連續失敗：後端與資料層每 30 秒一次、前端每 60 秒一次，2 分鐘約是 2 到 4 次
      - alert: EndpointDown
        expr: gatus_results_endpoint_success == 0
        for: 2m
        labels:
          severity: critical
          scope: service
        annotations:
          summary: "{{ $labels.name }}（{{ $labels.group }}）的探測持續失敗"

      # 容器停了：cAdvisor 在容器停掉之後仍輸出最後的值，序列不會消失，
      # 看 container_last_seen 有沒有停止前進。用 min：同一個服務重建後會有新舊兩個容器，
      # 舊的那個停止前進，新的仍在前進，取最小值才不會在重建時誤報。
      # 依 host 分開：同一個服務跑在兩台主機上時，一台停掉而另一台還在，不分開會被另一台的值蓋掉
      - alert: ContainerStopped
        expr: min by (host, container_label_com_docker_compose_service) (time() - container_last_seen{container_label_com_docker_compose_service!=""}) > 60
        for: 1m
        labels:
          severity: critical
          scope: service
        annotations:
          summary: "{{ $labels.host }} 上的 {{ $labels.container_label_com_docker_compose_service }} 已有 {{ $value | humanizeDuration }} 沒被 cAdvisor 看到"

  - name: latency
    rules:
      # 後端還沒輸出延遲分布（histogram）之前，延遲的告警用探測：15 分鐘內回應超過 0.5 秒的探測佔兩成以上。
      # 探測每 30 秒一次，15 分鐘只有 30 次，分位數在這個樣本數下近於取最慢的幾次，所以看慢探測的比例；
      # 子查詢的步長 30s 對齊探測間隔，讀取間隔要不長於探測間隔。探測程式自己在過載主機上的等待也算在裡面
      - alert: ProbeSlow
        expr: avg_over_time((gatus_results_duration_seconds{group="後端"} > bool 0.5)[15m:30s]) > 0.2
        for: 10m
        labels:
          severity: warning
          scope: service
        annotations:
          summary: "{{ $labels.name }} 的探測回應時間 15 分鐘 p95 是 {{ $value | humanizeDuration }}"

  - name: monitoring
    rules:
      # Prometheus 連不到 exporter。過載時讀取是間歇失敗，up == 0 加上 for 會在兩次失敗之間被打斷而永遠不成立，
      # 所以取 15 分鐘內讀取成功的比例。and up：讀取對象從清單拿掉之後 up 不再有值，
      # 時間窗裡移除前的失敗樣本就不再讓它成立（縮容、汰換主機時不會對已經不存在的主機告警十幾分鐘）
      - alert: ScrapeTargetDown
        expr: avg_over_time(up[15m]) < 0.9 and up
        for: 2m
        labels:
          severity: warning
          scope: monitoring
        annotations:
          summary: "Prometheus 連不到 {{ $labels.host }} 的 {{ $labels.job }}（{{ $labels.instance }}）"

      # exporter 連得到，但它連不到它監控的服務（up 照樣是 1）
      - alert: ExporterBackendDown
        expr: pg_up == 0 or redis_up == 0 or nginx_up == 0
        for: 2m
        labels:
          severity: warning
          scope: monitoring
        annotations:
          summary: "{{ $labels.host }} 的 {{ $labels.job }} exporter 連不到它監控的服務"

      # 主機清單空了：targets/node.yml 被清空或部署工具產生了空的清單時，node job 沒有任何目標，
      # up 序列不存在，ScrapeTargetDown 沒有序列可以判斷，所以另外檢查序列存不存在。
      # 個別主機停掉不靠這一條：它仍在清單上，up 變成 0，由 ScrapeTargetDown 處理
      - alert: HostTargetsMissing
        expr: absent(up{job="node"})
        for: 5m
        labels:
          severity: warning
          scope: monitoring
        annotations:
          summary: "node job 沒有任何讀取目標，檢查 targets/node.yml"

      # 讀取耗時逼近 scrape_timeout（10 秒）：再慢下去讀取會失敗、資料出現空洞。
      # 讀取耗時是間歇的尖峰，原始值加 for 幾乎不會成立，所以先取 5 分鐘內的最大值；逾時改了 8 要跟著改
      - alert: ScrapeNearTimeout
        expr: max_over_time(scrape_duration_seconds[5m]) > 8
        for: 5m
        labels:
          severity: warning
          scope: monitoring
        annotations:
          summary: "讀取 {{ $labels.job }} 要 {{ $value | humanize }} 秒，逼近 10 秒的逾時"

  - name: host
    rules:
      # 整台主機讀不到：node_exporter 5 分鐘內沒有一次讀取成功。用最大值而不是比例：過載時的間歇失敗
      # 中間總有成功的讀取，不會讓它成立。整台停掉時 cAdvisor 也讀不到，它的序列被標成過期，
      # ContainerStopped 不會成立，所以主機停掉要有自己的一則，嚴重度與服務停止相同
      - alert: HostDown
        expr: max_over_time(up{job="node"}[5m]) == 0
        for: 1m
        labels:
          severity: critical
          scope: host
        annotations:
          summary: "{{ $labels.host }} 的 node_exporter 5 分鐘內沒有一次讀取成功，主機可能停了或網路斷了"

      # 主機（macOS 上是 Docker 的虛擬機）5 分鐘平均的 load 超過核心數的 1.5 倍，或 steal 佔了一成以上的 CPU 時間。
      # load1 是間歇跳動的原始值，直接加 for 會被打斷（實測 12 小時最長連續 2 分鐘），所以先取 5 分鐘平均。
      # 1.5 與 0.1 是起始值，以主機平常的基準校正。Linux 的 load 含等磁碟讀寫的行程，磁碟爭用也會讓它成立。
      # keep_firing_for：症狀規則帶 15 分鐘的時間窗，主機恢復後還會成立一陣子，原因要多撐這麼久，抑制才不會先解除。
      # 虛擬機外面的競爭（Mac 上的其他程式）兩者都反映不到，見 README〈在 macOS 上跑時看不到 Mac 本身〉
      - alert: HostCpuSaturated
        expr: |
          avg_over_time(node_load1[5m]) / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
          or avg without (cpu, mode) (rate(node_cpu_seconds_total{mode="steal"}[5m])) > 0.1
        for: 5m
        keep_firing_for: 15m
        labels:
          severity: warning
          scope: host
        annotations:
          summary: "{{ $labels.host }} 主機飽和：load 除以核心數或 steal 的比例超過門檻（{{ $value | humanize }}）"

      # 同一顆磁碟常掛在好幾個掛載點，依裝置分組，一顆磁碟只發一則。
      # OrbStack 上 device="mac"（virtiofs）是 Mac 本機的磁碟，/dev/vdb1 是虛擬機放 Docker 資料的那一顆，
      # 兩顆的剩餘空間不同，都要涵蓋。用比例不用位元組：virtiofs 那一顆的位元組被放大 256 倍（區塊大小欄位
      # 填 1 MiB、區塊數以 4 KiB 計），比例不受影響。雲端主機的 ext4、xfs 沒有這個落差，同一條規則直接適用
      - alert: HostDiskLow
        expr: min by (host, device, fstype) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat"}) < 0.10
        for: 10m
        labels:
          severity: warning
          scope: host
        annotations:
          summary: "{{ $labels.host }} 的磁碟 {{ $labels.device }}（{{ $labels.fstype }}）剩 {{ $value | humanizePercentage }}"

  # 告警鏈本身的狀態：Prometheus 與 Alertmanager 有沒有在運作、通知送不送得出去
  - name: alerting-pipeline
    rules:
      # 永遠成立的心跳。Alertmanager 每 5 分鐘把它送到外部的心跳服務（alertmanager.yml 的 heartbeat），
      # 心跳服務一段時間沒收到就從外面通知：Prometheus、Alertmanager 或整台監控主機停掉時，
      # 其他告警都送不出來，只有「心跳停了」這件事能從監控主機以外的地方發現
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
          scope: monitoring
        annotations:
          summary: "告警鏈的心跳：Prometheus 在評估規則、Alertmanager 在送通知"

      # Alertmanager 送通知失敗（網址錯、私密檔沒放、通知服務拒收）。這則告警走 warning 的管道，
      # critical 的管道壞掉時它送得出來；warning 的管道本身壞掉時它送不出來，只在 Alertmanager 的頁面與日誌看得到
      - alert: AlertmanagerNotificationsFailing
        expr: sum by (host, integration) (increase(alertmanager_notifications_failed_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          scope: monitoring
        annotations:
          summary: "Alertmanager 經由 {{ $labels.integration }} 送通知失敗，10 分鐘內 {{ $value | printf \"%.0f\" }} 次"
