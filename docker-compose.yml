# 各服務目前只有框架骨架：Go 與 Laravel 只回應 /healthz，前台與後台是 create-vue 的範例頁。
# infra/nginx 的 conf.d 還沒寫路由，所以 8080 只會看到 Nginx 預設頁，各服務要從 compose 網路內存取。

services:
  nginx:
    build: ./infra/nginx
    environment:
      SHORT_DOMAIN: ${SHORT_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - portal
      - admin
      - go
      - laravel

  portal:
    build: ./web/portal

  admin:
    build: ./web/admin

  go:
    build: ./services/go
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      CACHE_ADDR: cache:6379
      JWT_SECRET: ${JWT_SECRET}
      SHORT_DOMAIN: ${SHORT_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_started

  laravel:
    build: ./services/laravel
    environment:
      APP_KEY: ${APP_KEY}
      # 寫到 stderr，`docker compose logs laravel` 才看得到；預設的 stack 會寫進容器內的檔案
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      SHORT_DOMAIN: ${SHORT_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 選定 Valkey，見 infra/cache/README.md；做效能比較時可換成 Redis 或 Dragonfly
  cache:
    image: valkey/valkey:8-alpine

volumes:
  pgdata:
